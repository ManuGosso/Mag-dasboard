# Actualización diaria automática de precios MAG

name: Actualización diaria de precios MAG

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Correr actualización diaria
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./data/mag_dashboard.db
        run: python -m app.scraper.run_daily_update

      - name: Guardar base SQLite actualizada
        run: |
          git config user.name "mag-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/data/mag_dashboard.db
          git diff --cached --quiet || git commit -m "Actualización automática de precios"
          git push
